name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The gym has no test dependencies at all — it runs on Node's own test
      # runner with type stripping. Checked before the install, because that is
      # a property worth keeping rather than assuming.
      - name: Tests, with nothing installed
        run: node --test --experimental-strip-types tests/*.test.ts

      # A passing suite proves nothing if it could not go red.
      - name: Mutation checks
        run: python3 tools/mail-mutation-check.py

      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
