name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first. The old run is measuring code nobody
# has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The gym core has no test dependencies at all. It runs on Node's own
      # test runner with type stripping, so this step needs nothing installed —
      # which is a property worth keeping, so it is checked before the install.
      - name: Tests, with nothing installed
        run: node --test --experimental-strip-types tests/*.test.ts

      # A passing test proves nothing on its own: two assertions here once
      # passed while matching a substring that survived the exact bug they
      # claimed to guard. Each of these reintroduces a real bug and requires the
      # suite to go red. They edit files and restore them, which is safe on a
      # throwaway checkout and is why they are not part of `npm test`.
      - name: Mutation checks — the tests have to be able to fail
        run: |
          python3 tools/mutation-check.py
          python3 tools/reachability-check.py
          python3 tools/loop-mutation-check.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # npm install rather than npm ci, so CI does not depend on a lockfile
      # being committed. Both respect package-lock.json when one exists.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

      # `next build` type-checks the app, and the app's tsconfig deliberately
      # excludes runner/ so Playwright's types never reach the Next build.
      # Excluded is not the same as unchecked, and it was unchecked for a while
      # — which is exactly how a dead comparison survived in it.
      - run: npm run typecheck:runner
